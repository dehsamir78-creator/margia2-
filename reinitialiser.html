<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nouveau mot de passe | Margia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
.auth{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px}
.btn{border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 15px var(--body);padding:12px;cursor:pointer}
.msg{font-size:14px;border-radius:8px;padding:10px 12px}
.msg.err{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.msg.ok{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos)}
h1{font-size:28px}
</style>
</head>
<body>
<main class="auth">
  <h1>Choisis un nouveau mot de passe</h1>
  <div class="card">
    <div class="msg err" id="err" hidden></div>
    <div class="msg ok" id="ok" hidden></div>
    <form id="f" novalidate><fieldset>
      <label for="pw">Nouveau mot de passe<small>8 caractères minimum</small><div class="field"><input id="pw" type="password" autocomplete="new-password" minlength="8"></div></label>
      <button class="btn" id="go" type="submit">Enregistrer</button>
    </fieldset></form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/assets/sb.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function show(id,t){$("err").hidden=true;$("ok").hidden=true;$(id).textContent=t;$(id).hidden=false}
  if(!window.MARGIA_READY){show("err","Les comptes ouvrent très bientôt.");return}
  $("f").addEventListener("submit",async function(e){
    e.preventDefault();var pw=$("pw").value;
    if(pw.length<8)return show("err","Le mot de passe doit faire au moins 8 caractères.");
    var r=await sb.auth.updateUser({password:pw});
    if(r.error)return show("err","Le lien a expiré ou n'est plus valide. Redemande un lien depuis la page de connexion.");
    show("ok","Mot de passe enregistré. Redirection…");setTimeout(function(){location.replace("/app")},1200);
  });
})();
</script>
</body>
</html>
